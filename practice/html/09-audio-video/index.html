<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Multimedia</title>
</head>
<body>

    <header>
        <h1>My Multimedia Practice</h1>
        <p>Learning to add audio and video in HTML.</p>
    </header>

    <main>

        <section>
            <h2>My Audio</h2>

            <audio controls>
                <source src="media/sample-audio.mp3" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
        </section>

        <hr>

        <section>
            <h2>My Video</h2>

            <video controls width="400">
                <source src="media/sample-video.mp4" type="video/mp4">
                Your browser does not support the video element.
            </video>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 Broun Verma</p>
    </footer>

</body>
</html>
